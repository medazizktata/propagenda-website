# Watermark new work media and upload it to R2.
#
# Push originals under media-inbox/ (path = the R2 key they should get) to main and this job
# marks them with tools/watermark/mark.cjs, verifies every output, then uploads to the
# propagenda-media bucket. See tools/watermark/process-inbox.cjs for the rules; nothing is
# uploaded unless every file in the push passes.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (an API token with "Workers R2 Storage:
# Edit" on the account) and CLOUDFLARE_ACCOUNT_ID.
name: Watermark media

on:
  push:
    branches: [main]
    paths: ['media-inbox/**']
  workflow_dispatch:
    inputs:
      all:
        description: Reprocess every file in media-inbox/ (unchanged originals are still skipped)
        type: boolean
        default: false

# One run at a time: runs read and rewrite the pipeline manifest in R2.
concurrency:
  group: watermark-media
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watermark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false # fetched below, for the changed files only

      - name: Work out which inbox files changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ALL" = "true" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1)"
          fi
          git diff --name-only --diff-filter=AMR -z "$BEFORE" HEAD -- media-inbox > "$RUNNER_TEMP/changed.z"
          echo "mode=list" >> "$GITHUB_OUTPUT"
          tr '\0' '\n' < "$RUNNER_TEMP/changed.z"

      - name: Fetch the changed files from LFS
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "all" ]; then
            git lfs pull --include="media-inbox/**"
          elif [ -s "$RUNNER_TEMP/changed.z" ]; then
            git lfs pull --include="$(tr '\0' ',' < "$RUNNER_TEMP/changed.z" | sed 's/,$//')"
          fi

      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Watermark, verify and upload
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "all" ]; then
            node tools/watermark/process-inbox.cjs --upload --all
          else
            xargs -0 -r node tools/watermark/process-inbox.cjs --upload < "$RUNNER_TEMP/changed.z"
          fi

      - name: Keep the build for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watermarked-media
          path: .watermark-out/
          if-no-files-found: ignore
          retention-days: 7
